<!DOCTYPE html>
<html lang="tm">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elektron wizitka</title>
<style>
:root{--bg-outer:#260508;--bg-card:#4a0a10;--bg-box:#2b0609;--gold:#d4af37;--gold-light:#f3e5ab;--text-main:#fff8e7;--text-muted:#e6cfa3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at top,#5c0d14 0%,#200406 100%);background-color:var(--bg-outer);color:var(--text-main);font-family:Georgia,serif;min-height:100vh;display:flex;justify-content:center;padding:12px}
.hidden{display:none!important}
.gen-wrap{width:100%;max-width:480px;background:#faf6ee;color:#2b1d12;font-family:system-ui,sans-serif;border-radius:12px;padding:18px 16px 26px;box-shadow:0 10px 30px rgba(0,0,0,.5);align-self:flex-start}
.gen-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.gen-badge{font-size:11.5px;font-weight:700;color:#6e141e;background:#efe4ce;padding:4px 9px;border-radius:6px}
.gen-lang-switch{display:flex;gap:5px}
.gen-lang-btn{padding:5px 11px;border-radius:6px;border:1px solid #6e141e;background:#fff;color:#6e141e;font-size:12.5px;font-weight:700;cursor:pointer}
.gen-lang-btn.active{background:#6e141e;color:#fff}
.gen-wrap h2{font-size:21px;margin-bottom:4px;color:#3d0c11}
.gen-sub{font-size:13px;color:#5a4838;margin-bottom:16px;line-height:1.4}
.field{margin-bottom:13px;min-width:0}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea,.service-group input{width:100%;min-width:0;padding:10px 11px;border:1px solid #cbbba0;border-radius:8px;font-size:14px;background:#fff;color:#1f160f;font-family:inherit}
.field textarea{resize:vertical;min-height:68px}
.hint{font-size:12px;color:#635141;margin-top:4px;line-height:1.35}
.hint.err{color:#b00020;font-weight:600}
.service-group{background:#f1e9da;border:1px solid #d9cbb3;border-radius:8px;padding:10px;margin-bottom:10px}
.service-group-title{font-size:12px;font-weight:700;color:#5c131b;margin-bottom:7px;text-transform:uppercase}
.row-2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr);gap:8px;margin-bottom:7px}
.check-row{display:flex;align-items:flex-start;gap:9px;margin:12px 0 16px;font-size:13px;line-height:1.4;cursor:pointer}
.check-row input{flex-shrink:0;width:18px;height:18px;margin-top:2px;accent-color:#6e141e}
.gen-btn{width:100%;padding:12px;border-radius:8px;font-size:14.5px;font-weight:600;cursor:pointer;border:1px solid #6e141e;margin-bottom:9px}
.gen-btn-main{background:#6e141e;color:#fff}
.gen-btn-alt{background:#fff;color:#6e141e}
.gen-btn-gold{background:#f3e5ab;color:#3d0c11;border-color:#b58d22}
.img-preview-box{margin-top:12px;text-align:center;background:#efe6d5;border:1px dashed #b58d22;border-radius:8px;padding:10px}
.img-preview-box img{max-width:100%;border-radius:6px;border:1px solid #6e141e;margin-bottom:8px}
.card{width:100%;max-width:440px;background:var(--bg-card);border:2px solid var(--gold);box-shadow:0 0 0 4px var(--bg-card),0 0 0 5px rgba(212,175,55,.55),0 12px 30px rgba(0,0,0,.6);padding:18px 16px 24px;align-self:flex-start}
.ornament-line{height:10px;background-image:repeating-linear-gradient(90deg,transparent 0,transparent 6px,var(--gold) 6px,var(--gold) 10px,transparent 10px,transparent 16px);opacity:.75;margin-bottom:14px}
.ornament-line.bottom{margin:18px 0 0}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.city-badge{font-family:system-ui,sans-serif;font-size:12px;color:var(--gold-light);border:1px solid rgba(212,175,55,.45);padding:5px 10px;background:rgba(0,0,0,.25)}
.lang-switch{display:flex;gap:6px;flex-shrink:0}
.lang-btn{background:transparent;color:var(--gold-light);border:1px solid var(--gold);padding:5px 12px;font-size:13px;font-weight:bold;cursor:pointer;font-family:system-ui,sans-serif}
.lang-btn.active{background:var(--gold);color:#260508}
.hero{text-align:center;background:var(--bg-box);border:1px solid var(--gold);padding:20px 14px;margin-bottom:18px}
.hero-tag{font-family:system-ui,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin-bottom:8px}
.hero h1{font-size:24px;line-height:1.25;color:var(--gold-light);margin-bottom:8px;font-weight:normal}
.hero p{font-family:system-ui,sans-serif;font-size:13.5px;line-height:1.45;color:var(--text-muted)}
.section-title{text-align:center;font-size:16px;color:var(--gold-light);letter-spacing:.8px;margin-bottom:12px;text-transform:uppercase}
.service-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.service-item{background:rgba(34,4,7,.72);border:1px solid rgba(212,175,55,.55);padding:12px 13px}
.service-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:5px}
.service-name{font-size:15.5px;font-weight:bold;line-height:1.3}
.service-price{font-family:system-ui,sans-serif;font-size:13px;font-weight:700;color:#260508;background:var(--gold);padding:3px 8px;white-space:nowrap;flex-shrink:0}
.service-desc{font-family:system-ui,sans-serif;font-size:12.5px;line-height:1.4;color:var(--text-muted)}
.info-box{font-family:system-ui,sans-serif;font-size:13.5px;color:var(--text-main);line-height:1.5;border:1px solid rgba(212,175,55,.45);padding:10px 12px;margin-bottom:18px;background:rgba(0,0,0,.2)}
.info-box b{color:var(--gold-light)}
.steps-box{background:rgba(0,0,0,.22);border-top:1px solid rgba(212,175,55,.4);border-bottom:1px solid rgba(212,175,55,.4);padding:12px 10px;margin-bottom:18px;font-family:system-ui,sans-serif;font-size:13px;color:var(--text-muted);line-height:1.5}
.steps-box strong{color:var(--gold-light);display:block;margin-bottom:4px;font-size:13.5px}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;padding:13px 14px;font-family:system-ui,sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;border:1px solid var(--gold)}
.btn-primary{background:var(--gold);color:#240407}
.btn-secondary{background:var(--bg-box);color:var(--gold-light)}
.nf{align-self:center;text-align:center;color:var(--text-muted);font-family:system-ui,sans-serif;padding:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a0305;color:var(--gold-light);border:1px solid var(--gold);padding:10px 16px;font-family:system-ui,sans-serif;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:92vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

    <div class="gen-lang-switch">

  <div class="img-preview-box hidden" id="imgPreviewBox">

  </div>
</div>

<div class="card hidden" id="cardView">
  <div class="ornament-line"></div>
  <div class="top-bar">
    <div class="city-badge" id="cityText"></div>
    <div class="lang-switch">
      <button type="button" class="lang-btn active" id="btnTm" onclick="setLang('tm')">TM</button>
      <button type="button" class="lang-btn" id="btnRu" onclick="setLang('ru')">RU</button>
    </div>
  </div>
  <div class="hero">
    <div class="hero-tag" id="heroTag"></div>
    <h1 id="heroTitle"></h1>
    <p id="heroSub"></p>
  </div>
  <div class="section-title hidden" id="servicesTitle"></div>
  <div class="service-list" id="serviceList"></div>
  <div class="info-box hidden" id="infoBox"></div>
  <div class="steps-box" id="stepsBox"></div>
  <div class="actions">
    <a class="btn btn-primary" id="callBtn" href="#"></a>
    <button type="button" class="btn btn-secondary" id="saveBtn" onclick="saveContact()"></button>
    <button type="button" class="btn btn-secondary" id="copyBtn" onclick="copyPhone()"></button>
    <a class="btn btn-secondary" id="waBtn" href="#" target="_blank" rel="noopener"></a>
    <a class="btn btn-secondary hidden" id="mapBtn" href="#" target="_blank" rel="noopener"></a>
    <button type="button" class="btn btn-secondary" id="shareBtn" onclick="sharePage()"></button>
  </div>
  <div class="ornament-line bottom"></div>
</div>

<div class="nf hidden" id="notFound">Wizitka tapylmady / Визитка не найдена</div>

<canvas id="cardCanvas" class="hidden"></canvas>
<div class="toast" id="toast"></div>

<script>
// ИЗМЕНИТЕ КОД! Генератор открывается так: .../elektron-vizitka/?admin=ВАШ_КОД
const ADMIN_CODE = "Yusup1606";

const genUi = {
  tm: {

    imgHint:"Surat ýüklenildi (ýa-da basyp saklap, IMO-a ugradyň).", copiedLink:"Ssylka göçürildi!", imgDone:"Surat taýýar!", mapLabel:"«Kartada görkez» düwmesini görkez (VPN-siz açylmaýar)", btnFile:"Wizitkany faýl edip ýükle (VPN-siz açylýar)", btnVcf:"Kontakt faýlyny ýükle (.vcf)", fileDone:"Faýl ýüklendi!", fileErr:"Faýl döredip bolmady (VPN açyň)"
  },
  ru: {
    badge:"ГЕНЕРАТОР", title:"Ссылка на визитку / прайс",
    sub:"Заполните данные заказчика — ссылка и карточка соберутся сами.",
    lblOpenLang:"Язык при открытии", optTm:"Туркменский (клиент сможет переключить на RU)", optRu:"Русский (клиент сможет переключить на TM)",
    lblCity:"Город / локация", lblName:"Имя мастера или название услуги", phName:"Например: Fotosuratçy Rustam / Ремонт",
    lblDesc:"Краткое описание (подзаголовок)", phDesc:"Например: Toý we dabaralar üçin surat",
    srv1Title:"Услуга / товар 1", srv2Title:"Услуга / товар 2", srv3Title:"Услуга / товар 3 (если нужно)",
    phSrvName:"Название услуги", phSrvDesc:"Краткое описание (необязательно)", price3:"Цена",
    lblHours:"Часы работы (необязательно)", phHours:"Например: 09:00–18:00, воскресенье выходной",
    lblAddr:"Адрес (необязательно)", phAddr:"Например: Туркменабат, ул. Garaşsyzlyk 12",
    addrHint:"По адресу появится кнопка «Показать на карте».",
    lblPhone:"Номер заказчика", phoneHint:"8 цифр или полностью с 993.", phoneErr:"Неверный номер: нужно 8 цифр или 11 с 993.",
    waLabel:"У заказчика есть WhatsApp (показать кнопку «Написать в WhatsApp»)",
    lblOutLink:"Готовая ссылка", btnCopyLink:"Скопировать ссылку", btnShareLink:"Отправить (IMO / WhatsApp / TG)",
    btnOpenCheck:"Открыть и проверить", btnMakeImg:"Создать картинку (для IMO)",
    imgHint:"Картинка сохранена (или зажмите её, чтобы сохранить / отправить в IMO).", copiedLink:"Ссылка скопирована!", imgDone:"Картинка создана!", mapLabel:"Показывать кнопку карты (без VPN не открывается)", btnFile:"Скачать визитку файлом (работает без VPN)", btnVcf:"Скачать контакт (.vcf)", fileDone:"Файл скачан!", fileErr:"Не удалось создать файл (включите VPN)"
  }
};

const uiText = {
  tm: {
    tag:"Elektron wizitka", servicesTitle:"Hyzmatlar we bahalar", defTitle:"Hyzmatlar we nyrhnamasy",
    stepsTitle:"Nädip habarlaşmaly?",
    stepsText:"1. IMO ýa-da WhatsApp arkaly ýazyň. 2. Sargydyňyzy we wagtyny takyklaň. 3. Göni jaň etmek üçin aşaky düwmä basyň.",
    callBtn:"Jaň etmek: ", saveBtn:"Kontakta goşmak", copyBtn:"IMO üçin belgini göçürmek", waBtn:"WhatsApp-da ýazmak",
    mapBtn:"Kartada görkez", shareBtn:"Sahypany paýlaşmak", hours:"Iş wagty: ", addr:"Salgy: ",
    copiedMsg:"Belgi göçürildi: ", sharedMsg:"Ssylka göçürildi!", savedMsg:"Kontakt faýly ýüklendi"
  },
  ru: {
    tag:"Электронная визитка", servicesTitle:"Услуги и цены", defTitle:"Услуги и прайс-лист",
    stepsTitle:"Как связаться и заказать?",
    stepsText:"1. Напишите в IMO или WhatsApp. 2. Уточните детали заказа и время. 3. Или позвоните напрямую по кнопке ниже.",
    callBtn:"Позвонить: ", saveBtn:"Сохранить в контакты", copyBtn:"Скопировать номер для IMO", waBtn:"Написать в WhatsApp",
    mapBtn:"Показать на карте", shareBtn:"Поделиться визиткой", hours:"Часы работы: ", addr:"Адрес: ",
    copiedMsg:"Номер скопирован: ", sharedMsg:"Ссылка скопирована!", savedMsg:"Файл контакта загружен"
  }
};

let currentGenLang = "tm";
let cardData = {lang:"tm", city:"", title:"", sub:"", phoneRaw:"", phoneDisp:"", hasWa:true, hours:"", addr:""};
const $ = id => document.getElementById(id);

function setGenLang(lang) {
  currentGenLang = lang;
  const g = genUi[lang];
  $("genBtnTm").classList.toggle("active", lang==="tm");
  $("genBtnRu").classList.toggle("active", lang==="ru");
  const T = {genBadge:"badge",genTitle:"title",genSub:"sub",lblOpenLang:"lblOpenLang",optTm:"optTm",optRu:"optRu",
    lblCity:"lblCity",lblName:"lblName",lblDesc:"lblDesc",srv1Title:"srv1Title",srv2Title:"srv2Title",srv3Title:"srv3Title",
    lblHours:"lblHours",lblAddr:"lblAddr",addrHint:"addrHint",lblPhone:"lblPhone",waLabel:"waLabel",lblOutLink:"lblOutLink",
    btnCopyLink:"btnCopyLink",btnShareLink:"btnShareLink",btnOpenCheck:"btnOpenCheck",btnMakeImg:"btnMakeImg",imgHint:"imgHint",mapLabel:"mapLabel",btnFile:"btnFile",btnVcf:"btnVcf"};
  for (const id in T) $(id).textContent = g[T[id]];
  $("inTitle").placeholder = g.phName;
  $("inSub").placeholder = g.phDesc;
  $("inHours").placeholder = g.phHours;
  $("inAddr").placeholder = g.phAddr;
  ["s1Name","s2Name","s3Name"].forEach(id => $(id).placeholder = g.phSrvName);
  ["s1Desc","s2Desc","s3Desc"].forEach(id => $(id).placeholder = g.phSrvDesc);
  $("s1Price").placeholder = "100 TMT";
  $("s2Price").placeholder = "200 TMT";
  $("s3Price").placeholder = g.price3;
  updatePhoneHint();
}

// Возвращает null, если номер неверный или пустой
function formatPhone(input) {
  let d = (input || "").replace(/\D/g, "");
  if (d.length === 8) d = "993" + d;
  if (!(d.length === 11 && d.startsWith("993"))) return null;
  return {raw:"+" + d, disp:`+993 ${d.slice(3,5)} ${d.slice(5)}`};
}

function updatePhoneHint() {
  const v = $("inPhone").value.trim();
  const h = $("phoneHint");
  const bad = v && !formatPhone(v);
  h.textContent = bad ? genUi[currentGenLang].phoneErr : genUi[currentGenLang].phoneHint;
  h.classList.toggle("err", !!bad);
}

function getFormState() {
  const lang = $("inLang").value;
  const phoneInput = $("inPhone").value.trim();
  const services = [];
  for (let i = 1; i <= 3; i++) {
    const name = $(`s${i}Name`).value.trim(), price = $(`s${i}Price`).value.trim(), desc = $(`s${i}Desc`).value.trim();
    if (name || price) services.push({name, price, desc});
  }
  return {
    lang,
    city: $("inCity").value.trim() || "Türkmenabat • Lebap",
    title: $("inTitle").value.trim() || uiText[lang].defTitle,
    sub: $("inSub").value.trim(),
    hours: $("inHours").value.trim(),
    addr: $("inAddr").value.trim(),
    phoneInput, ph: formatPhone(phoneInput),
    hasWa: $("inWa").checked, showMap: $("inMap").checked, services
  };
}

function buildLink() {
  updatePhoneHint();
  const st = getFormState();
  if (!st.ph) { $("outLink").value = ""; return ""; }
  const p = new URLSearchParams();
  p.set("v","1"); p.set("l",st.lang); p.set("c",st.city); p.set("t",st.title);
  if (st.sub) p.set("s",st.sub);
  if (st.hours) p.set("h",st.hours);
  if (st.addr) p.set("a",st.addr);
  p.set("p", st.ph.raw.replace("+993",""));
  p.set("w", st.hasWa ? "1" : "0");
  if (!st.showMap) p.set("m","0");
  st.services.forEach((s, idx) => {
    const i = idx + 1;
    if (s.name) p.set(`n${i}`, s.name);
    if (s.price) p.set(`pr${i}`, s.price);
    if (s.desc) p.set(`d${i}`, s.desc);
  });
  const url = location.origin + location.pathname + "?" + p.toString();
  $("outLink").value = url;
  return url;
}

// Возвращает ссылку или показывает ошибку, если номер не введён
function requireLink() {
  const url = buildLink();
  if (!url) showToast(genUi[currentGenLang].phoneErr);
  return url;
}

function copyGeneratedLink() {
  const url = requireLink();
  if (url) copyToClipboard(url, genUi[currentGenLang].copiedLink);
}
function shareGeneratedLink() {
  const url = requireLink();
  if (!url) return;
  if (navigator.share) navigator.share({title:getFormState().title, url}).catch(()=>{});
  else copyToClipboard(url, genUi[currentGenLang].copiedLink);
}
function openPreview() {
  const url = requireLink();
  if (url) window.open(url, "_blank");
}

function wrapLines(ctx, text, maxW) {
  if (!text) return [];
  const lines = []; let line = "";
  for (const w of text.split(/\s+/)) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function generateImoImage() {
  const st = getFormState();
  if (!st.ph) { showToast(genUi[currentGenLang].phoneErr); return; }
  const canvas = $("cardCanvas"), ctx = canvas.getContext("2d");
  const W = 900, pad = 54, innerW = W - pad*2;

  ctx.font = "bold 30px Georgia, serif";
  const titleLines = wrapLines(ctx, st.title, innerW - 60);
  ctx.font = "22px sans-serif";
  const subLines = wrapLines(ctx, st.sub, innerW - 60);
  const extra = [];
  if (st.hours) extra.push(uiText[st.lang].hours + st.hours);
  if (st.addr) extra.push(uiText[st.lang].addr + st.addr);
  ctx.font = "21px sans-serif";
  const extraLines = extra.flatMap(t => wrapLines(ctx, t, innerW - 20));

  let servicesH = 0;
  const prepared = st.services.map(s => {
    ctx.font = "bold 25px Georgia, serif";
    const nLines = wrapLines(ctx, s.name, innerW - 230);
    ctx.font = "20px sans-serif";
    const dLines = wrapLines(ctx, s.desc, innerW - 44);
    const h = 34 + Math.max(1, nLines.length) * 32 + (dLines.length ? dLines.length*26 + 8 : 0);
    servicesH += h + 18;
    return {...s, nLines, dLines, h};
  });

  const heroH = 90 + titleLines.length*38 + (subLines.length ? subLines.length*28 + 14 : 0);
  const extraH = extraLines.length ? extraLines.length*28 + 30 : 0;
  const H = Math.max(920, 210 + heroH + (prepared.length ? 65 + servicesH : 20) + extraH + 210);
  canvas.width = W; canvas.height = H;

  const grad = ctx.createRadialGradient(W/2,120,40,W/2,H/2,H);
  grad.addColorStop(0,"#5e0e15"); grad.addColorStop(1,"#240407");
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = "#d4af37"; ctx.lineWidth = 4; ctx.strokeRect(24,24,W-48,H-48);
  ctx.strokeStyle = "rgba(212,175,55,.55)"; ctx.lineWidth = 2; ctx.strokeRect(36,36,W-72,H-72);

  let y = 84;
  ctx.fillStyle = "#f3e5ab"; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "left";
  ctx.fillText(st.city, pad, y);
  ctx.textAlign = "right"; ctx.fillStyle = "#d4af37";
  ctx.fillText(st.lang==="tm" ? "ELEKTRON WIZITKA" : "ЭЛЕКТРОННАЯ ВИЗИТКА", W-pad, y);

  y += 28;
  ctx.fillStyle = "#2b0609"; ctx.fillRect(pad,y,innerW,heroH);
  ctx.strokeStyle = "#d4af37"; ctx.lineWidth = 2; ctx.strokeRect(pad,y,innerW,heroH);
  ctx.textAlign = "center";
  let hy = y + 54;
  ctx.fillStyle = "#f3e5ab"; ctx.font = "bold 32px Georgia, serif";
  titleLines.forEach(l => { ctx.fillText(l, W/2, hy); hy += 38; });
  if (subLines.length) {
    hy += 6; ctx.fillStyle = "#e6cfa3"; ctx.font = "22px sans-serif";
    subLines.forEach(l => { ctx.fillText(l, W/2, hy); hy += 28; });
  }
  y += heroH + 46;

  if (prepared.length) {
    ctx.fillStyle = "#f3e5ab"; ctx.font = "bold 23px Georgia, serif"; ctx.textAlign = "center";
    ctx.fillText(st.lang==="tm" ? "HYZMATLAR WE BAHALAR" : "УСЛУГИ И ЦЕНЫ", W/2, y);
    y += 26;
    prepared.forEach(s => {
      ctx.fillStyle = "rgba(32,4,7,.78)"; ctx.fillRect(pad,y,innerW,s.h);
      ctx.strokeStyle = "rgba(212,175,55,.6)"; ctx.lineWidth = 1.5; ctx.strokeRect(pad,y,innerW,s.h);
      if (s.price) {
        ctx.font = "bold 21px sans-serif";
        const pw = ctx.measureText(s.price).width + 26;
        ctx.fillStyle = "#d4af37"; ctx.fillRect(W-pad-pw-16, y+16, pw, 36);
        ctx.fillStyle = "#240407"; ctx.textAlign = "center";
        ctx.fillText(s.price, W-pad-pw/2-16, y+41);
      }
      ctx.fillStyle = "#fff8e7"; ctx.font = "bold 25px Georgia, serif"; ctx.textAlign = "left";
      let sy = y + 42;
      s.nLines.forEach(l => { ctx.fillText(l, pad+20, sy); sy += 32; });
      if (s.dLines.length) {
        sy += 4; ctx.fillStyle = "#e6cfa3"; ctx.font = "20px sans-serif";
        s.dLines.forEach(l => { ctx.fillText(l, pad+20, sy); sy += 26; });
      }
      y += s.h + 18;
    });
  }

  if (extraLines.length) {
    ctx.fillStyle = "#e6cfa3"; ctx.font = "21px sans-serif"; ctx.textAlign = "center";
    let ey = y + 8;
    extraLines.forEach(l => { ctx.fillText(l, W/2, ey); ey += 28; });
  }

  const footY = H - 180;
  ctx.fillStyle = "#d4af37"; ctx.fillRect(pad,footY,innerW,96);
  ctx.fillStyle = "#240407"; ctx.textAlign = "center"; ctx.font = "bold 20px sans-serif";
  const hint = st.lang==="tm" ? (st.hasWa ? "JAŇ ETMEK • IMO • WHATSAPP:" : "JAŇ ETMEK • IMO:")
                              : (st.hasWa ? "ЗВОНОК • IMO • WHATSAPP:" : "ЗВОНОК • IMO:");
  ctx.fillText(hint, W/2, footY+34);
  ctx.font = "bold 36px sans-serif"; ctx.fillText(st.ph.disp, W/2, footY+76);

  const dataUrl = canvas.toDataURL("image/png");
  $("imoImgPreview").src = dataUrl;
  $("imgPreviewBox").classList.remove("hidden");
  const a = document.createElement("a");
  a.download = "vizitka-" + st.ph.raw.replace("+","") + ".png";
  a.href = dataUrl;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast(genUi[currentGenLang].imgDone);
}

function setLang(lang) {
  cardData.lang = lang;
  const u = uiText[lang];
  $("btnTm").classList.toggle("active", lang==="tm");
  $("btnRu").classList.toggle("active", lang==="ru");
  $("heroTag").textContent = u.tag;
  $("servicesTitle").textContent = u.servicesTitle;
  $("stepsBox").innerHTML = `<strong>${u.stepsTitle}</strong>${u.stepsText}`;
  $("callBtn").textContent = u.callBtn + cardData.phoneDisp;
  $("saveBtn").textContent = u.saveBtn;
  $("copyBtn").textContent = u.copyBtn;
  $("waBtn").textContent = u.waBtn;
  $("mapBtn").textContent = u.mapBtn;
  $("shareBtn").textContent = u.shareBtn;
  renderInfo();
}

function renderInfo() {
  const u = uiText[cardData.lang], box = $("infoBox"), parts = [];
  if (cardData.hours) parts.push(`<b>${u.hours}</b>${escapeHtml(cardData.hours)}`);
  if (cardData.addr) parts.push(`<b>${u.addr}</b>${escapeHtml(cardData.addr)}`);
  box.innerHTML = parts.join("<br>");
  box.classList.toggle("hidden", !parts.length);
}

function renderCard(params) {
  const ph = formatPhone(params.get("p"));
  if (!ph) { $("notFound").classList.remove("hidden"); return; }
  cardData.lang = params.get("l") === "ru" ? "ru" : "tm";
  cardData.city = params.get("c") || "Türkmenabat • Lebap";
  cardData.title = params.get("t") || uiText[cardData.lang].defTitle;
  cardData.sub = params.get("s") || "";
  cardData.hours = params.get("h") || "";
  cardData.addr = params.get("a") || "";
  cardData.phoneRaw = ph.raw; cardData.phoneDisp = ph.disp;
  cardData.hasWa = params.get("w") !== "0";

  const services = [];
  for (let i = 1; i <= 3; i++) {
    const name = params.get(`n${i}`), price = params.get(`pr${i}`), desc = params.get(`d${i}`);
    if (name || price) services.push({name:name||"", price:price||"", desc:desc||""});
  }

  $("cityText").textContent = cardData.city;
  $("heroTitle").textContent = cardData.title;
  document.title = cardData.title;
  if (cardData.sub) $("heroSub").textContent = cardData.sub; else $("heroSub").classList.add("hidden");

  $("servicesTitle").classList.toggle("hidden", !services.length);
  $("serviceList").innerHTML = services.map(it => `
    <div class="service-item">
      <div class="service-head">
        <div class="service-name">${escapeHtml(it.name)}</div>
        ${it.price ? `<div class="service-price">${escapeHtml(it.price)}</div>` : ""}
      </div>
      ${it.desc ? `<div class="service-desc">${escapeHtml(it.desc)}</div>` : ""}
    </div>`).join("");

  $("callBtn").href = "tel:" + cardData.phoneRaw;
  if (cardData.hasWa) $("waBtn").href = "https://wa.me/" + cardData.phoneRaw.replace("+","");
  else $("waBtn").classList.add("hidden");
  if (cardData.addr && params.get("m") !== "0") {
    $("mapBtn").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(cardData.addr + " " + cardData.city);
    $("mapBtn").classList.remove("hidden");
  }

  setLang(cardData.lang);
  $("cardView").classList.remove("hidden");
}

function saveContact() {
  const clean = s => (s || "").replace(/[\\;,]/g, " ").replace(/\r?\n/g, " ");
  const vcf = ["BEGIN:VCARD","VERSION:3.0",
    "FN:" + clean(cardData.title), "ORG:" + clean(cardData.title),
    "TEL;TYPE=CELL:" + cardData.phoneRaw,
    cardData.addr ? "ADR;TYPE=WORK:;;" + clean(cardData.addr) + ";;;;" : "",
    location.protocol.startsWith("http") ? "URL:" + location.href : "",
    "END:VCARD"].filter(Boolean).join("\r\n");
  const blob = new Blob([vcf], {type:"text/vcard;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kontakt.vcf";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  showToast(uiText[cardData.lang].savedMsg);
}

function saveBlob(content, type, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function downloadVcf() {
  const st = getFormState();
  if (!st.ph) { showToast(genUi[currentGenLang].phoneErr); return; }
  const c = x => (x || "").replace(/[\\;,]/g, " ").replace(/\r?\n/g, " ");
  const vcf = ["BEGIN:VCARD","VERSION:3.0","FN:" + c(st.title),"ORG:" + c(st.title),
    "TEL;TYPE=CELL:" + st.ph.raw,
    st.addr ? "ADR;TYPE=WORK:;;" + c(st.addr) + ";;;;" : "",
    st.hours ? "NOTE:" + c(st.hours) : "","END:VCARD"].filter(Boolean).join("\r\n");
  saveBlob(vcf, "text/vcard;charset=utf-8", "kontakt-" + st.ph.raw.slice(1) + ".vcf");
  showToast(genUi[currentGenLang].fileDone);
}
async function downloadCardFile() {
  const url = requireLink();
  if (!url) return;
  const st = getFormState();
  try {
    const src = await (await fetch(location.origin + location.pathname)).text();
    const rnd = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    const q = JSON.stringify(new URL(url).search).replace(/</g, "\\u003c");
    const baked = src
      .replace(/const ADMIN_CODE = "[^"]*";/, () => 'const ADMIN_CODE = "' + rnd + '";')
      .replace("<script>", () => "<script>window.BAKED=" + q + ";");
    saveBlob(baked, "text/html;charset=utf-8", "vizitka-" + st.ph.raw.slice(1) + ".html");
    showToast(genUi[currentGenLang].fileDone);
  } catch (e) { showToast(genUi[currentGenLang].fileErr); }
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function showToast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2400);
}
function copyToClipboard(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
  else fallbackCopy(text, msg);
}
function fallbackCopy(text, msg) {
  const inp = document.createElement("input");
  inp.value = text; document.body.appendChild(inp); inp.select();
  document.execCommand("copy"); document.body.removeChild(inp); showToast(msg);
}
function copyPhone() {
  copyToClipboard(cardData.phoneRaw, uiText[cardData.lang].copiedMsg + cardData.phoneDisp);
}
function sharePage() {
  const url = location.href;
  if (navigator.share) navigator.share({title:cardData.title, url}).catch(()=>{});
  else copyToClipboard(url, uiText[cardData.lang].sharedMsg);
}

const urlParams = new URLSearchParams(window.BAKED || location.search);
if (window.BAKED) $("shareBtn").classList.add("hidden");
if (urlParams.get("v") === "1") {
  renderCard(urlParams);
} else if (urlParams.get("admin") === ADMIN_CODE) {
  $("generatorView").classList.remove("hidden");
  setGenLang("tm");
  document.querySelectorAll("#generatorView input, #generatorView select").forEach(el => {
    el.addEventListener("input", buildLink);
    el.addEventListener("change", buildLink);
  });
  buildLink();
} else {
  $("notFound").classList.remove("hidden");
}
</script>
